<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Soroscan is an open-source Stellar block explorer. See what's happening on Stellar."
    />
    <link rel="preconnect" href="https://horizon.stellar.org" crossorigin />
    <link rel="preconnect" href="https://mainnet.sorobanrpc.com" crossorigin />
    <title>soroscan</title>
    <script>
      const stored = localStorage.getItem("theme");
      const dark = stored
        ? stored === "dark"
        : matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.classList.toggle("dark", dark);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
